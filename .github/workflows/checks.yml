name: Offline checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core-and-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # This version has Linux wheels for the complete core dependency set.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install CPU dependencies and Icarus Verilog
        run: |
          python -m pip install -r requirements-core.txt
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Check numerical helpers and launchers
        run: python -m unittest discover -s tests -v
      - name: Check the 2D Arty example against stored layer values
        run: python scripts/simulate_arty.py 2d --simulator iverilog
      - name: Check every distance-three cleanup input
        run: python scripts/check_cleanup_d3.py --simulate --simulator iverilog
      - name: Check the run-time search and cluster decoders
        run: |
          python scripts/check_minimum_weight_d3.py --simulate --simulator iverilog
          python scripts/check_hdrg_online.py --distance 3 --simulator iverilog
          python scripts/check_hdrg_online.py --distance 5 --simulator iverilog
      - name: Exercise the CNN and correction lookup together
        run: python scripts/check_hybrid_d3.py --frames 4 --simulator iverilog
      - name: Check the larger-patch HDRG engine and its CNN input
        run: |
          python scripts/check_hdrg_stream.py --distance 7 --samples 1 --simulator iverilog
          python scripts/check_hybrid_hdrg.py --distance 3 --samples-per-rate 1 --simulator iverilog
